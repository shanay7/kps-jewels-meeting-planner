const SUPABASE_URL = "https://bwwvbuwqdepqwqioemte.supabase.co";
const SUPABASE_KEY = "sb_publishable_I40_asp5E8-tgOGGUUjLYA_UqnYLeFh";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Constants ─────────────────────────────────────────────────────────────────
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_S  = ["S","M","T","W","T","F","S"];
const DAY_F  = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function getDays(y,m){return new Date(y,m+1,0).getDate();}
function getFirst(y,m){return new Date(y,m,1).getDay();}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// ── Design tokens ─────────────────────────────────────────────────────────────

  bg1:    '#141210',
  bg2:    '#1c1916',
  bg3:    '#242018',
  border: '#2e2a20',
  border2:'#3e3a28',
  gold:   '#c8a45a',
  gold2:  '#e8c47a',
  text:   '#f0ead8',

// ── Shared UI ─────────────────────────────────────────────────────────────────
const Spinner = ({size=20,color=T.gold})=>(
  <div className="spin" style={{width:size,height:size,border:`2px solid ${color}22`,borderTop:`2px solid ${color}`,borderRadius:'50%'}}/>
);

const Btn = ({children,onClick,variant='primary',disabled,loading,style={},...p})=>{
  const styles = {
    primary:{background:T.gold,color:'#0c0a08',border:'none',fontWeight:500},
    secondary:{background:'transparent',color:T.text2,border:`1px solid ${T.border2}`},
    ghost:{background:'transparent',color:T.text3,border:'none'},
    danger:{background:'transparent',color:T.red,border:`1px solid ${T.red}44`},

  return(
    <button onClick={onClick} disabled={disabled||loading} {...p}

      {loading?<Spinner size={14} color={variant==='primary'?'#0c0a08':T.gold}/>:children}

const Input = ({label,error,...p})=>(

const Card = ({children,style={}})=>(

const Modal = ({title,children,onClose,width=440})=>(

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px',borderBottom:`1px solid ${T.border}`}}>

        <button onClick={onClose} style={{background:'none',border:'none',color:T.text3,fontSize:20,lineHeight:1}}>×</button>

);

const Toast = ({msg,type='success'})=>(
  msg?<div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:type==='success'?T.green:T.red,color:'#fff',padding:'10px 20px',borderRadius:20,fontSize:13,zIndex:2000,boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>{msg}</div>:null
);

// ── Calendar component ────────────────────────────────────────────────────────
function CalendarPicker({year,month,busyDates,onToggle,conflictMap={},readOnly=false}){
  const first=getFirst(year,month), days=getDays(year,month);
  const cells=useMemo(()=>{
    const c=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
    while(c.length%7)c.push(null);
    return c.map((d,i)=>({d,key:d?`d${d}`:`e${i}`}));
  },[year,month]);

  function prevM(){} // handled by parent
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
        {DAY_S.map((d,i)=><div key={i} style={{textAlign:'center',fontSize:10,color:T.text3,padding:'4px 0',letterSpacing:1}}>{d}</div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
        {cells.map(({d,key})=>{
          if(!d)return<div key={key}/>;
          const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const busy=busyDates.includes(dateStr);
          const conflicts=conflictMap[dateStr]||0;
          const isToday=year===today.getFullYear()&&month===today.getMonth()&&d===today.getDate();
          return(
            <button key={key} onClick={()=>!readOnly&&onToggle(dateStr)}
              style={{background:busy?T.gold:T.bg2,border:`1.5px solid ${busy?T.gold:isToday?T.gold+'88':T.border}`,borderRadius:8,padding:'6px 2px',minHeight:48,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:2,transition:'all 0.12s',cursor:readOnly?'default':'pointer'}}>
              <span style={{fontSize:13,color:busy?'#0c0a08':isToday?T.gold:T.text,fontWeight:isToday?600:400}}>{d}</span>
              {busy&&<span style={{fontSize:8,color:'#0c0a08',opacity:0.7}}>busy</span>}
              {!busy&&conflicts>0&&<span style={{fontSize:9,background:T.red+'33',color:T.red,borderRadius:3,padding:'0 3px'}}>{conflicts}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── AUTH SCREEN (login only — no public signup) ───────────────────────────────
function AuthScreen({onAuth}){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  // Handle invite link: Supabase puts #access_token in URL after invite
  const [isInvite,setIsInvite]=useState(false);
  const [newPassword,setNewPassword]=useState('');
  const [settingPassword,setSettingPassword]=useState(false);

  useEffect(()=>{
    // Check if this is an invite/recovery link
    const hash=window.location.hash;
    if(hash.includes('type=invite')||hash.includes('type=recovery')){
      setIsInvite(true);
    }
  },[]);

  async function handleLogin(){
    setLoading(true);setError('');
    const{error:e}=await sb.auth.signInWithPassword({email,password});
    if(e)setError('Invalid email or password. Please check your credentials.');
    setLoading(false);
  }

  async function handleSetPassword(){
    if(newPassword.length<6){setError('Password must be at least 6 characters.');return;}
    setSettingPassword(true);setError('');
    const{error:e}=await sb.auth.updateUser({password:newPassword});
    if(e)setError(e.message);
    else window.location.hash='';
    setSettingPassword(false);
  }

  // Invite flow — set your password
  if(isInvite) return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,background:T.bg}}>
      <div className="fade-up" style={{width:'100%',maxWidth:380}}>
        <div style={{textAlign:'center',marginBottom:40}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,letterSpacing:6,textTransform:'uppercase',color:T.text3,marginBottom:8}}>KPS Jewels</div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:300,color:T.text,letterSpacing:1}}>Welcome</h1>
          <div style={{width:40,height:1,background:T.gold,margin:'12px auto 0'}}/>
        </div>
        <Card style={{padding:28}}>
          <p style={{fontSize:13,color:T.text2,marginBottom:20,lineHeight:1.6}}>You've been invited to KPS Jewels Meeting Planner. Please set your password to continue.</p>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <Input label="Set Your Password" type="password" value={newPassword} onChange={e=>setNewPassword(e.target.value)} placeholder="Min. 6 characters"
              onKeyDown={e=>e.key==='Enter'&&handleSetPassword()}/>
            {error&&<div style={{fontSize:12,color:T.red,padding:'8px 12px',background:T.red+'11',borderRadius:6}}>{error}</div>}
            <Btn onClick={handleSetPassword} loading={settingPassword} style={{padding:'12px',fontSize:13,letterSpacing:1}}>Set Password & Sign In</Btn>
          </div>
        </Card>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,background:T.bg}}>
      <div className="fade-up" style={{width:'100%',maxWidth:380}}>
        <div style={{textAlign:'center',marginBottom:40}}>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,letterSpacing:6,textTransform:'uppercase',color:T.text3,marginBottom:8}}>KPS Jewels</div>
          <h1 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:32,fontWeight:300,color:T.text,letterSpacing:1}}>Meeting Planner</h1>
          <div style={{width:40,height:1,background:T.gold,margin:'12px auto 0'}}/>
        </div>
        <Card style={{padding:28}}>
          <div style={{marginBottom:20,paddingBottom:16,borderBottom:`1px solid ${T.border}`}}>
            <div style={{fontSize:13,color:T.text,fontFamily:"'Cormorant Garamond',serif",letterSpacing:0.5}}>Sign In</div>
            <div style={{fontSize:11,color:T.text3,marginTop:2}}>Access is by invitation only</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <Input label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"/>
            <Input label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"
              onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
            {error&&<div style={{fontSize:12,color:T.red,padding:'8px 12px',background:T.red+'11',borderRadius:6}}>{error}</div>}
            <Btn onClick={handleLogin} loading={loading} style={{marginTop:4,padding:'12px',fontSize:13,letterSpacing:1}}>Sign In</Btn>
          </div>
        </Card>
        <p style={{textAlign:'center',fontSize:11,color:T.text3,marginTop:16,lineHeight:1.6}}>
          Don't have access? Contact your administrator to receive an invite.
        </p>
      </div>
    </div>
  );
}

// ── MEETING PAGE (member marks availability) ──────────────────────────────────
function MeetingPage({token,profile,onBack}){
  const [meeting,setMeeting]=useState(null);
  const [members,setMembers]=useState([]);
  const [myBusy,setMyBusy]=useState([]);
  const [allBusy,setAllBusy]=useState({});
  const [submitted,setSubmitted]=useState(false);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState('');
  const [calYear,setCalYear]=useState(today.getFullYear());
  const [calMonth,setCalMonth]=useState(today.getMonth());

  function showToast(msg,type='success'){setToast({msg,type});setTimeout(()=>setToast(''),2500);}

  useEffect(()=>{loadMeeting();},[token]);

  async function loadMeeting(){
    setLoading(true);
    // Load meeting by token
    const{data:m,error:me}=await sb.from('meetings').select('*').eq('share_token',token).single();
    if(me||!m){setLoading(false);return;}
    setMeeting(m);
    setCalYear(m.year);
    setCalMonth(m.month-1);

    // Auto-add member if not already added
    await sb.from('meeting_members').upsert({meeting_id:m.id,profile_id:profile.id},{onConflict:'meeting_id,profile_id'});

    // Load all members
    const{data:mems}=await sb.from('meeting_members').select('profile_id, profiles(full_name,email)').eq('meeting_id',m.id);
    setMembers(mems||[]);

    // Load my busy dates
    const{data:myA}=await sb.from('availability').select('busy_date').eq('meeting_id',m.id).eq('profile_id',profile.id);
    setMyBusy((myA||[]).map(r=>r.busy_date));

    // Load all busy dates for conflict display
    const{data:allA}=await sb.from('availability').select('busy_date,profile_id').eq('meeting_id',m.id);
    const map={};
    (allA||[]).forEach(r=>{map[r.busy_date]=(map[r.busy_date]||0)+1;});
    setAllBusy(map);

    // Check if submitted
    const{data:sub}=await sb.from('submissions').select('id').eq('meeting_id',m.id).eq('profile_id',profile.id).single();
    setSubmitted(!!sub);
    setLoading(false);
  }

  async function toggleDate(dateStr){
    const busy=myBusy.includes(dateStr);
    // Optimistic update
    setMyBusy(prev=>busy?prev.filter(d=>d!==dateStr):[...prev,dateStr]);
    setAllBusy(prev=>({...prev,[dateStr]:(prev[dateStr]||0)+(busy?-1:1)}));
    if(busy){
      await sb.from('availability').delete().eq('meeting_id',meeting.id).eq('profile_id',profile.id).eq('busy_date',dateStr);
    } else {
      await sb.from('availability').upsert({meeting_id:meeting.id,profile_id:profile.id,busy_date:dateStr},{onConflict:'meeting_id,profile_id,busy_date'});
    }
  }

  async function handleSubmit(){
    setSaving(true);
    await sb.from('submissions').upsert({meeting_id:meeting.id,profile_id:profile.id},{onConflict:'meeting_id,profile_id'});
    setSubmitted(true);
    showToast('Availability submitted ✓');
    setSaving(false);
  }

  if(loading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:T.bg}}><Spinner size={32}/></div>;
  if(!meeting)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:T.bg,color:T.text2}}>Meeting not found or link is invalid.</div>;

  const totalMembers=members.length;
  const submittedCount=0; // would need extra query

  return(
    <div style={{minHeight:'100vh',background:T.bg}}>
      {/* Header */}
      <div style={{background:T.bg1,borderBottom:`1px solid ${T.border}`,padding:'0 20px',height:52,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10}}>
        <div>
          <div style={{fontSize:10,letterSpacing:3,textTransform:'uppercase',color:T.text3}}>KPS Jewels · Meeting Planner</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:12,color:T.text3}}>{profile.full_name}</span>
          <button onClick={()=>sb.auth.signOut()} style={{background:'none',border:`1px solid ${T.border}`,borderRadius:6,padding:'4px 10px',color:T.text3,fontSize:11}}>Sign out</button>
        </div>
      </div>

      <div style={{maxWidth:520,margin:'0 auto',padding:'28px 16px 80px'}}>
        {/* Meeting info */}
        <div className="fade-up" style={{marginBottom:24}}>
          <div style={{fontSize:11,letterSpacing:3,textTransform:'uppercase',color:T.gold,marginBottom:6}}>Meeting</div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:26,fontWeight:400,color:T.text,marginBottom:4}}>{meeting.title}</h2>
          {meeting.description&&<p style={{fontSize:13,color:T.text2,lineHeight:1.6}}>{meeting.description}</p>}
          <div style={{fontSize:12,color:T.text3,marginTop:8}}>{MONTHS[meeting.month-1]} {meeting.year}</div>
        </div>

        {/* Status */}
        {submitted&&(
          <div style={{background:T.green+'11',border:`1px solid ${T.green}33`,borderRadius:10,padding:'12px 16px',marginBottom:20,fontSize:13,color:T.green}}>
            ✓ You've submitted your availability. You can still update your dates below.
          </div>
        )}

        {/* Instruction */}
        <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:10,padding:'11px 14px',marginBottom:20,fontSize:12,color:T.text2,lineHeight:1.6}}>
          Tap dates you <strong style={{color:T.text}}>cannot attend</strong>. If you're free all month, just tap Submit.
        </div>

        {/* Month nav */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <button onClick={()=>calMonth===0?(setCalMonth(11),setCalYear(y=>y-1)):setCalMonth(m=>m-1)}
            style={{background:T.bg2,border:`1px solid ${T.border}`,color:T.text2,width:34,height:34,borderRadius:8,fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
          <span style={{fontSize:16,color:T.text}}>{MONTHS[calMonth]} {calYear}</span>
          <button onClick={()=>calMonth===11?(setCalMonth(0),setCalYear(y=>y+1)):setCalMonth(m=>m+1)}
            style={{background:T.bg2,border:`1px solid ${T.border}`,color:T.text2,width:34,height:34,borderRadius:8,fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
        </div>

        <CalendarPicker year={calYear} month={calMonth} busyDates={myBusy} onToggle={toggleDate} conflictMap={allBusy}/>

        <div style={{marginTop:12,display:'flex',gap:16,fontSize:11,color:T.text3}}>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,borderRadius:2,background:T.gold,display:'inline-block'}}/>Your busy date</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{background:T.red+'33',color:T.red,borderRadius:3,padding:'0 4px',fontSize:10}}>n</span>others busy</span>
        </div>

        <Btn onClick={handleSubmit} loading={saving} style={{width:'100%',marginTop:24,padding:'14px',fontSize:13,letterSpacing:1}}>
          {submitted?'Update Submission':'Submit Availability'}
        </Btn>
        <Btn variant="ghost" onClick={onBack} style={{width:'100%',marginTop:10,padding:'12px',fontSize:12,letterSpacing:1,color:T.text3}}>← Back to Dashboard</Btn>
      </div>
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

// ── MEETING CARD ──────────────────────────────────────────────────────────────
function MeetingCard({meeting,profile,onOpenMeeting,onRefresh}){
  const [stats,setStats]=useState(null);
  const [showDetails,setShowDetails]=useState(false);
  const [copied,setCopied]=useState(false);
  const [confirmDelete,setConfirmDelete]=useState(false);
  const [deleting,setDeleting]=useState(false);
  const shareUrl=`${window.location.origin}${window.location.pathname}?m=${meeting.share_token}`;
  const canDelete=profile.is_super_admin;

  useEffect(()=>{loadStats();},[]);

  async function loadStats(){
    const[{data:members},{data:subs}]=await Promise.all([
      sb.from('meeting_members').select('profile_id').eq('meeting_id',meeting.id),
      sb.from('submissions').select('profile_id').eq('meeting_id',meeting.id),
    ]);
    setStats({total:(members||[]).length,submitted:(subs||[]).length});
  }

  function copyLink(){
    navigator.clipboard.writeText(shareUrl);
    setCopied(true);setTimeout(()=>setCopied(false),2000);
  }

  async function deleteMeeting(){
    setDeleting(true);
    await sb.from('availability').delete().eq('meeting_id',meeting.id);
    await sb.from('submissions').delete().eq('meeting_id',meeting.id);
    await sb.from('meeting_members').delete().eq('meeting_id',meeting.id);
    await sb.from('meetings').delete().eq('id',meeting.id);
    onRefresh();
  }

  return(
    <Card style={{padding:0,overflow:'hidden'}}>
      <div style={{padding:'16px 18px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:T.text3,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{meeting.departments?.name||'—'} · {MONTHS[meeting.month-1]} {meeting.year}</div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,color:T.text,marginBottom:4}}>{meeting.title}</div>
            {meeting.description&&<div style={{fontSize:12,color:T.text2,lineHeight:1.5}}>{meeting.description}</div>}
          </div>
          {stats&&(
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:20,color:stats.submitted===stats.total&&stats.total>0?T.green:T.text}}>{stats.submitted}/{stats.total}</div>
              <div style={{fontSize:10,color:T.text3,letterSpacing:1}}>SUBMITTED</div>
            </div>
          )}
        </div>
        {stats&&stats.total>0&&(
          <div style={{height:3,background:T.bg3,borderRadius:2,marginTop:12}}>
            <div style={{width:`${(stats.submitted/stats.total)*100}%`,height:'100%',background:T.gold,borderRadius:2,transition:'width 0.5s'}}/>
          </div>
        )}
      </div>
      <div style={{borderTop:`1px solid ${T.border}`,padding:'10px 18px',display:'flex',gap:8,flexWrap:'wrap'}}>
        <Btn variant="secondary" onClick={()=>onOpenMeeting(meeting.share_token)} style={{fontSize:12,padding:'7px 14px'}}>Mark My Dates</Btn>
        <Btn variant="secondary" onClick={copyLink} style={{fontSize:12,padding:'7px 14px'}}>{copied?'Copied ✓':'Copy Link'}</Btn>
        <Btn variant="secondary" onClick={()=>setShowDetails(true)} style={{fontSize:12,padding:'7px 14px'}}>Best Dates</Btn>
        {canDelete&&!confirmDelete&&(
          <Btn variant="danger" onClick={()=>setConfirmDelete(true)} style={{fontSize:12,padding:'7px 14px',marginLeft:'auto'}}>Delete</Btn>
        )}
        {canDelete&&confirmDelete&&(
          <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
            <span style={{fontSize:11,color:T.text3}}>Sure?</span>
            <Btn variant="danger" loading={deleting} onClick={deleteMeeting} style={{fontSize:12,padding:'6px 12px'}}>Yes, delete</Btn>
            <Btn variant="secondary" onClick={()=>setConfirmDelete(false)} style={{fontSize:12,padding:'6px 12px'}}>Cancel</Btn>
          </div>
        )}
      </div>
      {showDetails&&<MeetingDetailsModal meeting={meeting} onClose={()=>setShowDetails(false)}/>}
    </Card>
  );
}

// ── BEST DATES MODAL ──────────────────────────────────────────────────────────
function MeetingDetailsModal({meeting,onClose}){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{loadData();},[]);

  async function loadData(){
    const[{data:members},{data:avail},{data:subs}]=await Promise.all([
      sb.from('meeting_members').select('profile_id,profiles(full_name)').eq('meeting_id',meeting.id),
      sb.from('availability').select('busy_date,profile_id').eq('meeting_id',meeting.id),
      sb.from('submissions').select('profile_id,profiles(full_name)').eq('meeting_id',meeting.id),
    ]);
    // Count conflicts per date
    const conflictMap={};
    (avail||[]).forEach(r=>{conflictMap[r.busy_date]=(conflictMap[r.busy_date]||0)+1;});
    const total=(members||[]).length;
    // Build best dates: all must be free
    const days=getDays(meeting.year,meeting.month-1);
    const best=[];
    for(let d=1;d<=days;d++){
      const dateStr=`${meeting.year}-${String(meeting.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dow=new Date(meeting.year,meeting.month-1,d).getDay();
      if((conflictMap[dateStr]||0)===0) best.push({d,dow,dateStr});
    }
    // Pending members
    const subIds=new Set((subs||[]).map(s=>s.profile_id));
    const pending=(members||[]).filter(m=>!subIds.has(m.profile_id)).map(m=>m.profiles?.full_name||'—');
    setData({members,total,best,pending,subs:subs||[]});
    setLoading(false);
  }

  return(
    <Modal title={`Best Dates — ${meeting.title}`} onClose={onClose} width={500}>
      {loading?<div style={{display:'flex',justifyContent:'center',padding:32}}><Spinner/></div>:(
        <div>
          {data.pending.length>0&&(
            <div style={{background:'#c8a45a11',border:'1px solid #c8a45a33',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:T.text2}}>
              ⏳ <strong style={{color:T.text}}>{data.pending.length} member{data.pending.length>1?'s':''}</strong> haven't submitted yet: {data.pending.slice(0,4).join(', ')}{data.pending.length>4?` +${data.pending.length-4} more`:''}
            </div>
          )}
          <div style={{fontSize:12,color:T.text3,marginBottom:14}}>Showing dates where all {data.total} members are free</div>
          {data.best.length===0?(
            <div style={{textAlign:'center',padding:32,color:T.text2}}>
              <div style={{fontSize:32,marginBottom:8}}>📭</div>
              No fully free dates in {MONTHS[meeting.month-1]} {meeting.year}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {data.best.map(({d,dow,dateStr},idx)=>(
                <div key={dateStr} style={{background:idx===0?T.gold+'11':T.bg2,border:`1px solid ${idx===0?T.gold+'44':T.border}`,borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
                  <div style={{textAlign:'center',minWidth:48}}>
                    <div style={{fontSize:10,color:T.text3,textTransform:'uppercase',letterSpacing:1}}>{DAY_F[dow]}</div>
                    <div style={{fontSize:28,color:idx===0?T.gold:T.text,lineHeight:1.1}}>{d}</div>
                    <div style={{fontSize:10,color:T.text3}}>{MONTHS[meeting.month-1].slice(0,3)}</div>
                  </div>
                  <div style={{flex:1}}>
                    {idx===0&&<span style={{background:T.gold,color:'#0c0a08',fontSize:10,padding:'2px 8px',borderRadius:4,letterSpacing:1,textTransform:'uppercase'}}>★ Top Pick</span>}
                    <div style={{fontSize:13,color:T.green,marginTop:idx===0?6:0}}>All {data.total} members available ✓</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}

// ── CREATE MEETING MODAL ──────────────────────────────────────────────────────
function CreateMeetingModal({profile,onClose,onCreated}){
  const [depts,setDepts]=useState([]);
  const [title,setTitle]=useState('');
  const [desc,setDesc]=useState('');
  const [deptId,setDeptId]=useState('');
  const [month,setMonth]=useState(today.getMonth()+1);
  const [year,setYear]=useState(today.getFullYear());
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');

  useEffect(()=>{
    sb.from('departments').select('*').then(({data})=>{
      setDepts(data||[]);
      if(data&&data.length>0)setDeptId(data[0].id);
    });
  },[]);

  async function create(){
    if(!title.trim())return setError('Meeting title is required');
    if(!deptId)return setError('Please select a department');
    setLoading(true);setError('');
    const{data,error:e}=await sb.from('meetings').insert({
      title:title.trim(),description:desc.trim()||null,
      department_id:deptId,month,year,created_by:profile.id
    }).select().single();
    if(e){setError(e.message);setLoading(false);return;}
    // Auto-add creator as member
    await sb.from('meeting_members').insert({meeting_id:data.id,profile_id:profile.id});
    onCreated(data);
  }

  return(
    <Modal title="Create New Meeting" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>

          <label style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:T.text3}}>Description (optional)</label>

            style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:T.radius,padding:'10px 14px',color:T.text,fontSize:14,resize:'vertical'}}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:T.text3}}>Department</label>
          <select value={deptId} onChange={e=>setDeptId(e.target.value)}
            style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:T.radius,padding:'10px 14px',color:T.text,fontSize:14}}>
            {depts.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <label style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:T.text3}}>Month</label>
            <select value={month} onChange={e=>setMonth(Number(e.target.value))}
              style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:T.radius,padding:'10px 14px',color:T.text,fontSize:14}}>
              {MONTHS.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
            </select>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <label style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:T.text3}}>Year</label>
            <select value={year} onChange={e=>setYear(Number(e.target.value))}
              style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:T.radius,padding:'10px 14px',color:T.text,fontSize:14}}>
              {[2025,2026,2027,2028].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
        </div>
        {error&&<div style={{fontSize:12,color:T.red,padding:'8px 12px',background:T.red+'11',borderRadius:6}}>{error}</div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>

      </div>
    </Modal>
  );
}

// ── SUPER ADMIN MODAL ─────────────────────────────────────────────────────────
function SuperAdminModal({profile,onClose}){
  const [tab,setTab]=useState('invite');
  const [users,setUsers]=useState([]);
  const [depts,setDepts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [newDept,setNewDept]=useState('');
  const [toast,setToast]=useState('');
  // Invite
  const [inviteEmail,setInviteEmail]=useState('');
  const [inviteName,setInviteName]=useState('');
  const [inviting,setInviting]=useState(false);

  function showToast(msg,type='success'){setToast({msg,type});setTimeout(()=>setToast(''),3000);}

  useEffect(()=>{loadAll();},[]);

  async function loadAll(){
    setLoading(true);
    const[{data:u},{data:d}]=await Promise.all([
      sb.from('profiles').select('*').order('full_name'),
      sb.from('departments').select('*,department_admins(profile_id,profiles(full_name))').order('name'),
    ]);
    setUsers(u||[]);setDepts(d||[]);
    setLoading(false);
  }

  async function inviteMember(){
    if(!inviteEmail.trim()||!inviteName.trim())return;
    setInviting(true);
    // Use Supabase admin invite — sends email with invite link
    const{data,error:e}=await sb.auth.admin?.inviteUserByEmail
      ? sb.auth.admin.inviteUserByEmail(inviteEmail.trim(),{data:{full_name:inviteName.trim()}})
      // Fallback: signUp with a random password (they'll use forgot password to set their own)
      : await sb.functions.invoke('invite-user',{body:{email:inviteEmail.trim(),full_name:inviteName.trim()}});
    if(e){
      // Fallback: try regular signup which sends confirmation email
      const{error:e2}=await sb.auth.signUp({
        email:inviteEmail.trim(),
        password:Math.random().toString(36).slice(-10)+'A1!',
        options:{data:{full_name:inviteName.trim()},emailRedirectTo:window.location.origin+window.location.pathname}
      });
      if(e2)showToast('Error: '+e2.message,'error');
      else{showToast(`Invite sent to ${inviteEmail} ✓`);setInviteEmail('');setInviteName('');loadAll();}
    } else {
      showToast(`Invite sent to ${inviteEmail} ✓`);
      setInviteEmail('');setInviteName('');loadAll();
    }
    setInviting(false);
  }

  async function toggleSuperAdmin(u){
    await sb.from('profiles').update({is_super_admin:!u.is_super_admin}).eq('id',u.id);
    setUsers(prev=>prev.map(x=>x.id===u.id?{...x,is_super_admin:!x.is_super_admin}:x));
    showToast(`${u.full_name} ${!u.is_super_admin?'is now':'is no longer'} a super admin`);
  }

  async function addDept(){
    if(!newDept.trim())return;
    const{data}=await sb.from('departments').insert({name:newDept.trim(),created_by:profile.id}).select().single();
    if(data){setDepts(prev=>[...prev,{...data,department_admins:[]}]);setNewDept('');}
  }

  async function toggleDeptAdmin(deptId,userId,isAdmin){
    if(isAdmin){
      await sb.from('department_admins').delete().eq('department_id',deptId).eq('profile_id',userId);
    } else {
      await sb.from('department_admins').insert({department_id:deptId,profile_id:userId});
    }
    loadAll();
  }

  return(
    <Modal title="Super Admin Panel" onClose={onClose} width={560}>
      {/* Tabs */}
      <div style={{display:'flex',gap:0,marginBottom:20,background:T.bg2,borderRadius:8,padding:3}}>
        {['invite','users','departments'].map(t=>(
          <button key={t} onClick={()=>setTab(t)}
            style={{flex:1,padding:'8px',borderRadius:6,border:'none',background:tab===t?T.bg3:'transparent',color:tab===t?T.text:T.text3,fontSize:12,letterSpacing:1,textTransform:'uppercase',transition:'all 0.15s'}}>
            {t==='invite'?'Invite':t==='users'?'Members':'Departments'}
          </button>
        ))}
      </div>
      {loading&&tab!=='invite'?<div style={{display:'flex',justifyContent:'center',padding:24}}><Spinner/></div>:(
        <>
          {/* INVITE TAB */}
          {tab==='invite'&&(
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div style={{background:T.bg2,borderRadius:10,padding:'14px 16px',fontSize:13,color:T.text2,lineHeight:1.7}}>
                Enter the person's name and email. They'll receive an invite link to set their password and access the app.
              </div>
              <Input label="Full Name" value={inviteName} onChange={e=>setInviteName(e.target.value)} placeholder="e.g. Rahul Shah"/>
              <Input label="Email Address" type="email" value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} placeholder="rahul@kpsjewels.com"
                onKeyDown={e=>e.key==='Enter'&&inviteMember()}/>
              <Btn onClick={inviteMember} loading={inviting} style={{padding:'12px',fontSize:13,letterSpacing:1}}>
                Send Invite
              </Btn>
              {users.length>0&&(
                <div style={{marginTop:8}}>
                  <div style={{fontSize:11,color:T.text3,letterSpacing:2,textTransform:'uppercase',marginBottom:10}}>Current Members ({users.length})</div>
                  <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:220,overflowY:'auto'}}>
                    {users.map(u=>(
                      <div key={u.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:T.bg2,borderRadius:8}}>
                        <div>
                          <div style={{fontSize:13,color:T.text}}>{u.full_name}</div>
                          <div style={{fontSize:11,color:T.text3}}>{u.email}</div>
                        </div>
                        {u.is_super_admin&&<span style={{fontSize:10,color:T.gold,letterSpacing:1}}>SUPER ADMIN</span>}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
          {/* MEMBERS / SUPER ADMIN TAB */}
          {tab==='users'&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:11,color:T.text3,marginBottom:4}}>Toggle super admin access for any user</div>
              {users.map(u=>(
                <div key={u.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:T.bg2,borderRadius:8}}>
                  <div>
                    <div style={{fontSize:14,color:T.text}}>{u.full_name}</div>
                    <div style={{fontSize:11,color:T.text3}}>{u.email}</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {u.is_super_admin&&<span style={{fontSize:10,color:T.gold,letterSpacing:1}}>SUPER ADMIN</span>}
                    {u.id!==profile.id&&(
                      <Btn variant={u.is_super_admin?'danger':'secondary'} onClick={()=>toggleSuperAdmin(u)} style={{fontSize:11,padding:'5px 12px'}}>
                        {u.is_super_admin?'Revoke':'Promote'}
                      </Btn>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
          {tab==='departments'&&(
            <div>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                <Input value={newDept} onChange={e=>setNewDept(e.target.value)} placeholder="New department name…" style={{flex:1}} onKeyDown={e=>e.key==='Enter'&&addDept()}/>
                <Btn onClick={addDept} style={{whiteSpace:'nowrap'}}>Add</Btn>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {depts.map(d=>{
                  const adminIds=new Set((d.department_admins||[]).map(a=>a.profile_id));
                  return(
                    <div key={d.id} style={{background:T.bg2,borderRadius:10,padding:'14px'}}>
                      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,color:T.text,marginBottom:10}}>{d.name}</div>
                      <div style={{fontSize:11,color:T.text3,marginBottom:8,letterSpacing:1,textTransform:'uppercase'}}>Department Admins</div>
                      <div style={{display:'flex',flexDirection:'column',gap:6}}>
                        {users.map(u=>(
                          <div key={u.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                            <span style={{fontSize:13,color:adminIds.has(u.id)?T.text:T.text2}}>{u.full_name}</span>
                            <button onClick={()=>toggleDeptAdmin(d.id,u.id,adminIds.has(u.id))}
                              style={{background:adminIds.has(u.id)?T.gold+'22':'transparent',border:`1px solid ${adminIds.has(u.id)?T.gold+'44':T.border}`,borderRadius:6,padding:'3px 10px',color:adminIds.has(u.id)?T.gold:T.text3,fontSize:11,cursor:'pointer'}}>
                              {adminIds.has(u.id)?'✓ Admin':'Set Admin'}
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
      <Toast msg={toast.msg}/>
    </Modal>
  );
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(null);
  const [profile,setProfile]=useState(null);
  const [loading,setLoading]=useState(true);
  const [meetingToken,setMeetingToken]=useState(null);

  // Check URL for meeting token
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const m=params.get('m');
    if(m)setMeetingToken(m);
  },[]);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session)loadProfile(session.user.id);
      else setLoading(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setSession(session);
      if(session)loadProfile(session.user.id);
      else{setProfile(null);setLoading(false);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  async function loadProfile(uid){
    setLoading(true);
    const{data}=await sb.from('profiles').select('*').eq('id',uid).single();
    // Auto-promote sanghvishanay7@gmail.com to super admin
    if(data&&data.email==='sanghvishanay7@gmail.com'&&!data.is_super_admin){
      await sb.from('profiles').update({is_super_admin:true}).eq('id',uid);
      data.is_super_admin=true;
    }
    setProfile(data);
    setLoading(false);
  }

  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:T.bg,gap:16}}>
      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:T.text2,letterSpacing:2}}>KPS Jewels · Meeting Planner</div>
      <Spinner size={28}/>
    </div>
  );

  if(!session)return<AuthScreen onAuth={setSession}/>;
  if(!profile)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:T.bg}}><Spinner size={32}/></div>;

  // If opened via meeting link — show meeting page
  if(meetingToken)return<MeetingPage token={meetingToken} profile={profile} onBack={()=>setMeetingToken(null)}/>;

  return<Dashboard profile={profile} onOpenMeeting={t=>setMeetingToken(t)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
